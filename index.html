<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>어릴 적 육성·꾸미기 게임에 대한 짧은 설문</title>
<style>:root{--ink:#182126;--muted:#637078;--line:#dce3e6;--brand:#176b5b;--soft:#edf7f4;--danger:#b42318}*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f5f7f6;color:var(--ink);line-height:1.55}main{width:min(680px,calc(100% - 32px));margin:32px auto}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,42px);box-shadow:0 12px 34px #153c3212}.eyebrow{color:var(--brand);font-weight:800}.intro{color:var(--muted)}.progress{height:8px;background:#e7ecea;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--brand);transition:width .25s}.meta{display:flex;justify-content:space-between;gap:12px;margin:18px 0 28px;color:var(--muted);font-size:.92rem}fieldset{border:0;padding:0;margin:0;min-width:0}legend{font-size:1.28rem;font-weight:800;margin-bottom:18px;width:100%}.required,.error{color:var(--danger)}.help{font-size:.9rem;color:var(--muted);margin:-10px 0 16px}.option{display:flex;align-items:flex-start;gap:11px;width:100%;padding:13px 14px;margin:10px 0;border:1px solid var(--line);border-radius:12px;cursor:pointer;overflow-wrap:anywhere}.option:has(input:checked){border-color:var(--brand);background:var(--soft)}input[type=radio],input[type=checkbox]{width:19px;height:19px;margin:2px 0 0;accent-color:var(--brand);flex:0 0 auto}select,textarea,input[type=text]{width:100%;max-width:100%;font:inherit;border:1px solid #aeb9bd;border-radius:10px;padding:12px;background:#fff}textarea{min-height:150px;resize:vertical}.other{margin-top:12px}.hidden,[hidden]{display:none!important}.error{min-height:24px;font-size:.9rem;margin-top:12px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#e9eeec;color:var(--ink)}button:disabled{opacity:.55}.count{text-align:right;color:var(--muted);font-size:.88rem;margin-top:5px}.done{text-align:center;padding:28px 0}.done a{color:var(--brand)}@media(max-width:420px){main{width:calc(100% - 24px);margin:12px auto}.card{padding:20px 16px;border-radius:16px}.actions{flex-wrap:wrap}.actions>*{flex:1}.meta{font-size:.84rem}}</style></head>
<body><main><div class="card"><section id="surveyIntro"><div class="eyebrow">약 3분 소요 · 익명 설문</div><h1>어릴 적 육성·꾸미기 게임에 대한 짧은 설문</h1><p class="intro">안녕하세요! 세종대학교 콘텐츠 기획 수업 과제를 위한 설문입니다. 약 3분 소요되며, 응답은 익명으로 과제 분석에만 사용됩니다. 감사합니다 :)</p><p class="intro"><span class="required">*</span> 표시는 필수 문항입니다.</p></section><div id="surveyUi"><div class="progress" aria-label="진행률"><div id="progressBar"></div></div><div class="meta"><span id="stepLabel"></span><span id="progressText"></span></div><form id="surveyForm" novalidate><div id="questionHost"></div><p id="error" class="error" role="alert" aria-live="polite"></p><div class="actions"><button type="button" id="prev" class="secondary">이전</button><button type="button" id="next" class="primary">다음</button><button type="submit" id="submit" class="primary hidden">제출하기</button></div></form></div><section id="done" class="done hidden"><h2>응답이 제출되었습니다.</h2><p>소중한 의견을 보내 주셔서 감사합니다.</p></section></div></main>
<script>
// Apps Script 배포 후 아래 한 줄만 교체하세요.
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxVYysEYZAJNdBFiHI__oWMqbdIV_3wq_fy7rkBfx107-EGig4IKdArEJ0csd3EnzyWSQ/exec';
const questions=[
{id:'q1_age',title:'Q1. 연령대를 선택해 주세요.',required:true,type:'radio',options:['20대 초반','20대 후반','30대 초반','30대 후반','기타']},
{id:'q2_gender',title:'Q2. 성별을 선택해 주세요.',required:true,type:'radio',options:['여성','남성','기타','응답하지 않음']},
{id:'q3_idol',title:'Q3. 현재 좋아하는 아이돌이 있나요?',required:true,type:'radio',options:['있다','예전엔 있었다','없다']},
{id:'q4_games',title:'Q4. 어릴 때 해본 육성·꾸미기 게임을 모두 골라 주세요.',required:true,type:'checkbox',options:['파니룸','포우','다마고치','싸이월드 미니룸','쥬니어네이버 게임','기타','해본 적 없다'],other:true,exclusive:'해본 적 없다'},
{id:'q5_recent',title:'Q5. 최근 1년 안에 이런 게임이나 비슷한 활동을 다시 해본 적 있나요?',required:true,type:'checkbox',options:['육성·꾸미기 게임을 다시 해봤다','키링·인형 꾸미기, 다꾸, 포카 꾸미기 같은 활동을 해봤다','없다'],exclusive:'없다'},
{id:'q6_reasons',title:'Q6. 다시 하거나 끌린 이유는 무엇인가요?',required:false,type:'checkbox',options:['추억·향수 때문에','부담 없이 쉬고 싶어서','꾸미는 재미 때문에','캐릭터가 귀여워서','기타'],other:true},
{id:'q7_intent',title:'Q7. 좋아하는 아이돌을 닮은 캐릭터를 키우고 꾸미는 게임이 있다면 해볼 의향이 있나요?',required:false,type:'radio',options:['1','2','3','4','5'],help:'<span>1 = 전혀 없다</span><span>5 = 매우 있다</span>'},
{id:'q8_comeback',title:'Q8. 내가 키운 캐릭터나 모은 아이템이 실제 아이돌의 컴백 무대 연출에 반영된다면?',required:false,type:'radio',options:['더 열심히 하고 싶다','상관없다','부담스럽다']},
{id:'q9_album',title:'Q9. 앨범 속 QR 코드로 게임 캐릭터의 코스튬을 받을 수 있다면, 앨범 구매에 영향이 있을까요?',required:false,type:'radio',options:['구매할 이유가 늘어난다','영향 없다','오히려 거부감이 든다']},
{id:'q10_comment',title:'Q10. 가상 아이돌을 육성하고 꾸미는 게임이 있다면, 어떤 기능이나 특징이 있으면 좋을까요?',required:false,type:'textarea',max:500,placeholder:'예: 멤버와 대화하기, 방 꾸미기 아이템, 친구 방 놀러가기, 무대 의상 만들기 등 자유롭게 적어 주세요'}];
const answers={};let current=0,visible=[];const host=document.querySelector('#questionHost'),form=document.querySelector('#surveyForm'),error=document.querySelector('#error');
function visibleQuestions(){return questions.filter(q=>!(q.id==='q6_reasons'&&Array.isArray(answers.q5_recent)&&answers.q5_recent.includes('없다')))}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){visible=visibleQuestions();current=Math.min(current,visible.length-1);const q=visible[current],value=answers[q.id]??(q.type==='checkbox'?[]:'');let control='';if(q.type==='select')control=`<select id="${q.id}" name="${q.id}"><option value="">선택해 주세요</option>${q.options.map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select>`;else if(q.type==='textarea')control=`<textarea id="${q.id}" name="${q.id}" maxlength="${q.max}" placeholder="${esc(q.placeholder||'')}">${esc(value)}</textarea><div class="count"><span id="charCount">${String(value).length}</span>/${q.max}</div>`;else control=q.options.map(o=>`<label class="option"><input type="${q.type}" name="${q.id}" value="${esc(o)}" ${q.type==='checkbox'?(value.includes(o)?'checked':''):(value===o?'checked':'')}><span>${esc(o)}</span></label>`).join('');const otherValue=answers[q.id+'_other']||'',otherSelected=q.other&&(Array.isArray(value)?value.includes('기타'):value==='기타');host.innerHTML=`<fieldset><legend>${q.title}${q.required?' <span class="required" aria-label="필수">*</span>':''}</legend>${q.help?`<p class="help scale-labels">${q.help}</p>`:''}${control}${q.other?`<div id="otherWrap" class="other ${otherSelected?'':'hidden'}"><label for="${q.id}_other">기타 내용을 입력해 주세요.</label><input type="text" id="${q.id}_other" maxlength="100" value="${esc(otherValue)}"></div>`:''}</fieldset>`;document.querySelector('#stepLabel').textContent=`${current+1} / ${visible.length}`;const pct=Math.round((current+1)/visible.length*100);document.querySelector('#progressText').textContent=pct+'%';document.querySelector('#progressBar').style.width=pct+'%';document.querySelector('#prev').disabled=current===0;document.querySelector('#next').classList.toggle('hidden',current===visible.length-1);document.querySelector('#submit').classList.toggle('hidden',current!==visible.length-1);error.textContent='';bind(q)}
function bind(q){host.querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('input',()=>{save(q);toggleOther(q);if(q.type==='textarea')document.querySelector('#charCount').textContent=el.value.length}));if(q.type==='checkbox')host.querySelectorAll(`input[name="${q.id}"]`).forEach(el=>el.addEventListener('change',()=>{if(el.checked&&el.value===q.exclusive)host.querySelectorAll(`input[name="${q.id}"]`).forEach(x=>{if(x!==el)x.checked=false});else if(el.checked){const ex=[...host.querySelectorAll(`input[name="${q.id}"]`)].find(x=>x.value===q.exclusive);if(ex)ex.checked=false}save(q);toggleOther(q)}))}
function toggleOther(q){const wrap=document.querySelector('#otherWrap');if(!wrap)return;const v=answers[q.id];wrap.classList.toggle('hidden',!(Array.isArray(v)?v.includes('기타'):v==='기타'))}
function save(q=visible[current]){if(q.type==='checkbox')answers[q.id]=[...host.querySelectorAll(`input[name="${q.id}"]:checked`)].map(x=>x.value);else{const selector=q.type==='radio'?`[name="${q.id}"]:checked`:`[name="${q.id}"]`,el=host.querySelector(selector);answers[q.id]=el?el.value:''}const other=host.querySelector(`#${q.id}_other`);if(other)answers[q.id+'_other']=other.value.trim()}
function validate(q=visible[current]){save(q);const v=answers[q.id];if(q.required&&(!v||(Array.isArray(v)&&!v.length))){error.textContent='필수 문항에 응답해 주세요.';return false}if(q.other&&(Array.isArray(v)?v.includes('기타'):v==='기타')&&!answers[q.id+'_other']){error.textContent='기타 내용을 입력해 주세요.';return false}return true}
document.querySelector('#next').addEventListener('click',()=>{if(!validate())return;const id=visible[current].id;if(id==='q5_recent'){if(answers.q5_recent.includes('없다')){answers.q6_reasons=[];answers.q6_reasons_other=''}visible=visibleQuestions();current=visible.findIndex(q=>q.id===id)}current++;render()});document.querySelector('#prev').addEventListener('click',()=>{save();current--;render()});
form.addEventListener('submit',async e=>{e.preventDefault();if(!validate())return;if(SCRIPT_URL.includes('PASTE_')){error.textContent='먼저 index.html 상단의 SCRIPT_URL을 설정해 주세요.';return}const button=document.querySelector('#submit');button.disabled=true;button.textContent='제출 중…';const payload={};questions.forEach(q=>{payload[q.id]=answers[q.id]??(q.type==='checkbox'?[]:'');if(q.other)payload[q.id+'_other']=answers[q.id+'_other']||''});try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});document.querySelector('#surveyIntro').classList.add('hidden');document.querySelector('#surveyUi').classList.add('hidden');document.querySelector('#done').classList.remove('hidden')}catch(err){error.textContent='제출하지 못했습니다. 인터넷 연결과 SCRIPT_URL을 확인해 주세요.';button.disabled=false;button.textContent='제출하기'}});render();
</script><style>
/* Toss 스타일을 참고한 가독성 중심 UI */
:root{--ink:#191f28;--muted:#6b7684;--line:#e5e8eb;--brand:#3182f6;--soft:#f2f7ff;--danger:#f04452}body{background:#f2f4f6;color:var(--ink);letter-spacing:-.015em}main{width:min(640px,calc(100% - 32px));margin:48px auto}.card{border:0;border-radius:24px;padding:clamp(24px,6vw,48px);box-shadow:0 8px 28px rgba(0,0,0,.06)}h1{font-size:clamp(2rem,6vw,2.75rem);line-height:1.25;letter-spacing:-.04em;margin:10px 0 14px}.eyebrow{font-size:.9rem;color:var(--brand)}.intro{font-size:1rem;line-height:1.7}.progress{height:6px;background:#edf0f3}.progress>div{background:var(--brand)}.meta{margin:14px 0 34px;font-size:.88rem}legend{font-size:clamp(1.35rem,4vw,1.65rem);line-height:1.4;letter-spacing:-.03em;margin-bottom:22px}.help{font-size:.95rem;line-height:1.6}.scale-labels{display:flex;justify-content:space-between;gap:16px}.option{gap:12px;padding:16px;margin:10px 0;border-color:#e5e8eb;border-radius:14px;font-weight:600;transition:background .15s,border-color .15s,transform .15s}.option:hover{background:#f7f8fa}.option:has(input:checked){border-color:#90bfff;background:var(--soft);color:#1b64da}.option:active{transform:scale(.995)}input[type=radio],input[type=checkbox]{accent-color:var(--brand)}select,textarea,input[type=text]{border-color:#d1d6db;border-radius:12px;padding:15px;background:#f9fafb;outline:none;transition:border-color .15s,box-shadow .15s}select:focus,textarea:focus,input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(49,130,246,.12);background:#fff}.actions{margin-top:24px}.actions button{min-height:52px;border-radius:13px;padding:14px 20px}.primary{background:var(--brand)}.primary:hover{background:#1b64da}.secondary{background:#f2f4f6;color:#4e5968}.error{font-weight:600}.done h2{font-size:1.8rem}.done a{color:var(--brand);font-weight:700}@media(max-width:420px){main{width:100%;margin:0}.card{min-height:100vh;border-radius:0;padding:28px 20px}.actions{position:sticky;bottom:0;background:#fff;padding:12px 0 4px}}
</style></body></html>
