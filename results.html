<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>육성·꾸미기 게임 설문 결과</title>
  <style>
    :root{--ink:#17211d;--muted:#66726d;--line:#dfe5e1;--brand:#126e5a;--brand2:#24a383;--soft:#edf7f4;--amber:#a45f00;--amber-bg:#fff6e7;--paper:#fff;--bg:#f4f7f5}
    *{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}button,select{font:inherit}main{width:min(1120px,calc(100% - 32px));margin:32px auto 64px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.top h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:5px 0}.eyebrow{color:var(--brand);font-weight:800;letter-spacing:.04em}.muted{color:var(--muted)}.back{color:var(--brand);font-weight:700;text-decoration:none;white-space:nowrap}.panel,.toolbar,.metric,.insight{background:var(--paper);border:1px solid var(--line);border-radius:16px}.toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:end;padding:18px;margin:24px 0}.toolbar label{font-size:.86rem;font-weight:750;color:#44514b}.toolbar select{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #abb6b0;border-radius:9px;background:white}.button{border:0;border-radius:9px;padding:11px 15px;background:#e8eeeb;color:var(--ink);font-weight:750;cursor:pointer}.button.primary{background:var(--brand);color:white}.notice{padding:12px 15px;border-radius:11px;background:var(--amber-bg);color:#704400;margin:0 0 18px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{padding:20px}.metric span{color:var(--muted);font-size:.9rem}.metric strong{display:block;margin-top:5px;font-size:clamp(1.55rem,3vw,2.1rem);color:var(--brand)}.section-title{margin:34px 0 14px}.section-title h2{margin:0 0 4px}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.insight{padding:20px;border-top:4px solid var(--brand2)}.insight .label{font-size:.84rem;color:var(--muted)}.insight strong{display:block;font-size:1.18rem;margin:7px 0}.insight p{margin:0;color:var(--muted);font-size:.92rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{padding:20px;min-width:0}.panel h3{margin:0 0 18px}.bar-row{margin:14px 0}.bar-head{display:flex;justify-content:space-between;gap:12px;font-size:.92rem}.bar-head span:first-child{overflow-wrap:anywhere}.bar-head span:last-child{white-space:nowrap;color:var(--muted)}.bar{height:10px;background:#e9eeeb;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}.comments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quote{margin:0;padding:16px;background:#f7f9f8;border-left:3px solid var(--brand2);border-radius:0 10px 10px 0;overflow-wrap:anywhere}.quote small{display:block;color:var(--muted);margin-top:9px}.empty{text-align:center;padding:44px 20px;color:var(--muted)}.error{color:#b42318;background:#fff0ee;padding:14px;border-radius:10px}.footer-actions{display:flex;justify-content:flex-end;margin:18px 0}
    @media(max-width:800px){.toolbar{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.insights,.grid{grid-template-columns:1fr}.top{display:block}.back{display:inline-block;margin-top:8px}}
    @media(max-width:480px){main{width:calc(100% - 24px);margin:18px auto 40px}.toolbar,.metrics{grid-template-columns:1fr}.comments{grid-template-columns:1fr}.toolbar .button{width:100%}}
  </style>
  <style>
    /* Toss 스타일을 참고한 가독성 중심 UI */
    :root{--ink:#191f28;--muted:#6b7684;--line:#e5e8eb;--brand:#3182f6;--brand2:#4593fc;--soft:#f2f7ff;--amber:#8b5c00;--amber-bg:#fff8e7;--paper:#fff;--bg:#f2f4f6}
    body{letter-spacing:-.015em}main{width:min(1120px,calc(100% - 40px));margin:48px auto 80px}.top h1{font-size:clamp(2.1rem,5vw,3rem);line-height:1.2;letter-spacing:-.045em;margin:10px 0 14px}.eyebrow{font-size:.86rem}.top .muted{font-size:1.05rem}.back{padding:11px 15px;border-radius:11px;background:#fff;color:var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.04)}
    .panel,.toolbar,.metric,.insight{border:0;border-radius:20px;box-shadow:0 3px 14px rgba(0,0,0,.035)}.toolbar{padding:22px;gap:14px}.toolbar label{color:#4e5968}.toolbar select{margin-top:8px;padding:13px;border-color:#d1d6db;border-radius:11px;background:#f7f8fa;outline:none}.toolbar select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(49,130,246,.12);background:#fff}.button{min-height:46px;border-radius:11px;background:#e8f3ff;color:#1b64da}.button.primary{background:var(--brand);color:#fff}.button:hover{filter:brightness(.97)}
    .metrics{gap:16px}.metric{padding:24px}.metric span{color:#6b7684;font-weight:600}.metric strong{margin-top:9px;color:var(--ink);letter-spacing:-.04em}.section-title{margin:42px 0 16px}.section-title h2{font-size:1.55rem;letter-spacing:-.03em}.insight{padding:24px;border-top:0}.insight::before{content:'';display:block;width:28px;height:5px;border-radius:99px;background:var(--brand);margin-bottom:18px}.insight strong{font-size:1.28rem;color:var(--ink)}.panel{padding:24px}.panel h3{font-size:1.15rem}.bar{height:11px;background:#edf0f3}.bar i{background:var(--brand)}.quote{background:#f7f8fa;border-left-color:#90bfff}.notice{border:1px solid #ffe4a3}.footer-actions .primary{padding-left:20px;padding-right:20px}
    @media(max-width:800px){main{width:min(100% - 28px,720px);margin:28px auto 56px}.top .back{margin-top:14px}.metrics{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){main{width:calc(100% - 24px);margin:24px auto 44px}.metrics{grid-template-columns:1fr 1fr;gap:10px}.metric{padding:18px}.metric strong{font-size:1.55rem}.toolbar{padding:16px}.panel{padding:18px}.section-title{margin-top:34px}}
  </style>
</head>
<body><main>
  <header class="top"><div><div class="eyebrow">UX RESEARCH DASHBOARD</div><h1>육성·꾸미기 게임 설문 인사이트</h1><p class="muted">어릴 적 게임 경험과 가상 아이돌 게임 수요를 익명 응답으로 살펴봅니다.</p></div><a class="back" href="index.html">설문으로 돌아가기</a></header>
  <div id="status">결과를 불러오는 중…</div>
  <div id="app" hidden>
    <section class="toolbar" aria-label="응답 필터">
      <label>연령대<select id="age"><option value="전체">전체</option></select></label>
      <label>성별<select id="gender"><option value="전체">전체</option></select></label>
      <label>아이돌 선호 상태<select id="idol"><option value="전체">전체</option></select></label>
      <button id="reset" class="button" type="button">필터 초기화</button>
    </section>
    <div id="sampleNotice" class="notice" hidden></div>
    <section class="metrics" aria-label="핵심 지표">
      <div class="metric"><span>분석 응답 수</span><strong id="total">0명</strong></div>
      <div class="metric"><span>게임 이용 의향 평균</span><strong id="average">-</strong></div>
      <div class="metric"><span>게임 이용 긍정</span><strong id="intentRate">-</strong></div>
      <div class="metric"><span>앨범 구매 긍정</span><strong id="purchaseRate">-</strong></div>
    </section>
    <div class="section-title"><h2>한눈에 보는 발견점</h2><div class="muted">현재 필터에 해당하는 응답에서 가장 많이 나타난 신호입니다.</div></div>
    <section id="insights" class="insights"></section>
    <div class="section-title"><h2>문항별 근거</h2><div class="muted">복수 선택 문항은 전체 응답자 대비 선택 비율입니다.</div></div>
    <section id="charts" class="grid"></section>
    <div class="section-title"><h2>응답자의 목소리</h2><div class="muted">추가 의견 원문을 최근 응답부터 최대 20개 표시합니다.</div></div>
    <section class="panel"><div id="comments" class="comments"></div></section>
    <div class="footer-actions"><button id="download" class="button primary" type="button">현재 결과 CSV 내려받기</button></div>
  </div>
</main>
<script>
// index.html과 동일한 Apps Script 웹 앱 URL로 교체하세요.
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxVYysEYZAJNdBFiHI__oWMqbdIV_3wq_fy7rkBfx107-EGig4IKdArEJ0csd3EnzyWSQ/exec';
const chartDefs=[
  {key:'q4_games',title:'Q4 어릴 때 해본 게임'},
  {key:'q5_recent',title:'Q5 최근 1년 활동'},
  {key:'q6_reasons',title:'Q6 다시 하거나 끌린 이유'},
  {key:'q7_intent',title:'Q7 가상 아이돌 게임 이용 의향',order:['5','4','3','2','1']},
  {key:'q8_comeback',title:'Q8 컴백 무대 연동 반응',order:['더 열심히 하고 싶다','상관없다','부담스럽다']},
  {key:'q9_album',title:'Q9 코스튬 QR의 앨범 구매 영향',order:['구매할 이유가 늘어난다','영향 없다','오히려 거부감이 든다']}
];
let rows=[];
function loadResults(){
  if(SCRIPT_URL.includes('PASTE_'))return fail('먼저 results.html 상단의 SCRIPT_URL을 Apps Script 웹 앱 주소로 바꿔 주세요.');
  const callback='surveyResults_'+Date.now();
  window[callback]=data=>{delete window[callback];script.remove();if(!data||!data.ok)return fail(data&&data.error?data.error:'결과 형식이 올바르지 않습니다.');rows=data.rows||[];init()};
  const script=document.createElement('script');script.onerror=()=>fail('결과를 불러오지 못했습니다. Apps Script URL과 공개 권한을 확인해 주세요.');script.src=SCRIPT_URL+'?action=results&callback='+callback;document.body.appendChild(script);
}
function fail(message){const el=document.querySelector('#status');el.textContent=message;el.className='error'}
function init(){
  addOptions('#age',unique('q1_age'));addOptions('#gender',unique('q2_gender'));addOptions('#idol',unique('q3_idol'));
  document.querySelectorAll('.toolbar select').forEach(el=>el.addEventListener('change',render));
  document.querySelector('#reset').addEventListener('click',()=>{document.querySelectorAll('.toolbar select').forEach(el=>el.value='전체');render()});
  document.querySelector('#download').addEventListener('click',downloadCsv);
  document.querySelector('#status').hidden=true;document.querySelector('#app').hidden=false;render();
}
function unique(key){return [...new Set(rows.map(row=>row[key]).filter(Boolean))].sort()}
function addOptions(selector,values){document.querySelector(selector).insertAdjacentHTML('beforeend',values.map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join(''))}
function filtered(){const age=document.querySelector('#age').value,gender=document.querySelector('#gender').value,idol=document.querySelector('#idol').value;return rows.filter(row=>(age==='전체'||row.q1_age===age)&&(gender==='전체'||row.q2_gender===gender)&&(idol==='전체'||row.q3_idol===idol))}
function render(){
  const data=filtered(),n=data.length,scores=data.map(row=>Number(row.q7_intent)).filter(score=>score>=1&&score<=5),albumAnswers=data.filter(row=>row.q9_album),purchasePositive=albumAnswers.filter(row=>row.q9_album==='구매할 이유가 늘어난다').length;
  setText('#total',n+'명');setText('#average',scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1)+' / 5':'-');setText('#intentRate',scores.length?percent(scores.filter(score=>score>=4).length,scores.length):'-');setText('#purchaseRate',albumAnswers.length?percent(purchasePositive,albumAnswers.length):'-');
  const notice=document.querySelector('#sampleNotice');notice.hidden=n===0||n>=5;notice.textContent=n>0?'현재 표본이 5명 미만입니다. 방향성 탐색에만 활용하고 일반화는 피하세요.':'';
  if(!n){document.querySelector('#insights').innerHTML='<div class="panel empty">필터 조건에 맞는 응답이 없습니다.</div>';document.querySelector('#charts').innerHTML='';document.querySelector('#comments').innerHTML='<p class="muted">표시할 의견이 없습니다.</p>';return}
  renderInsights(data);document.querySelector('#charts').innerHTML=chartDefs.map(def=>chart(data,def)).join('');renderComments(data);
}
function renderInsights(data){
  const game=topValue(data,'q4_games',['해본 적 없다']),reason=topValue(data,'q6_reasons'),active=data.filter(row=>Array.isArray(row.q5_recent)&&!row.q5_recent.includes('없다')).length;
  const items=[
    ['가장 많이 경험한 게임',game?game.label:'데이터 부족',game?`${game.count}명 · ${percent(game.count,data.length)}가 선택했습니다.`:'게임 경험 응답이 더 필요합니다.'],
    ['다시 끌리는 핵심 이유',reason?reason.label:'데이터 부족',reason?`${reason.count}명 · ${percent(reason.count,data.length)}가 선택했습니다.`:'최근 활동 경험자의 응답이 더 필요합니다.'],
    ['최근 1년 재경험',percent(active,data.length),`${active}명이 게임 또는 유사 꾸미기 활동을 했습니다.`]
  ];
  document.querySelector('#insights').innerHTML=items.map(([label,value,detail])=>`<article class="insight"><span class="label">${esc(label)}</span><strong>${esc(value)}</strong><p>${esc(detail)}</p></article>`).join('');
}
function valuesFor(data,key){return data.flatMap(row=>Array.isArray(row[key])?row[key]:(row[key]?[row[key]]:[]))}
function countsFor(data,key){return valuesFor(data,key).reduce((acc,value)=>(acc[value]=(acc[value]||0)+1,acc),{})}
function topValue(data,key,excluded=[]){const entry=Object.entries(countsFor(data,key)).filter(([label])=>!excluded.includes(label)).sort((a,b)=>b[1]-a[1])[0];return entry?{label:entry[0],count:entry[1]}:null}
function chart(data,def){
  const counts=countsFor(data,def.key);let entries=Object.entries(counts);entries=def.order?def.order.filter(label=>counts[label]).map(label=>[label,counts[label]]):entries.sort((a,b)=>b[1]-a[1]);
  const body=entries.length?entries.map(([label,count])=>{const pct=Math.round(count/data.length*100);return `<div class="bar-row"><div class="bar-head"><span>${esc(label)}</span><span>${count}명 · ${pct}%</span></div><div class="bar" role="img" aria-label="${esc(label)} ${pct}%"><i style="width:${pct}%"></i></div></div>`}).join(''):'<p class="muted">해당 응답이 없습니다.</p>';
  return `<article class="panel"><h3>${esc(def.title)}</h3>${body}</article>`;
}
function renderComments(data){
  const comments=data.filter(row=>String(row.q10_comment||'').trim()).sort((a,b)=>String(b.timestamp||'').localeCompare(String(a.timestamp||''))).slice(0,20);
  document.querySelector('#comments').innerHTML=comments.length?comments.map(row=>`<blockquote class="quote">“${esc(row.q10_comment)}”<small>${esc([row.q1_age,row.q2_gender,row.q3_idol].filter(Boolean).join(' · '))}</small></blockquote>`).join(''):'<p class="muted">작성된 추가 의견이 없습니다.</p>';
}
function downloadCsv(){
  const data=filtered();if(!data.length)return;
  const keys=['timestamp','q1_age','q2_gender','q3_idol','q4_games','q4_games_other','q5_recent','q6_reasons','q6_reasons_other','q7_intent','q8_comeback','q9_album','q10_comment'];
  const cell=value=>'"'+String(Array.isArray(value)?value.join(' | '):(value??'')).replace(/"/g,'""')+'"';
  const csv='\ufeff'+[keys.join(','),...data.map(row=>keys.map(key=>cell(row[key])).join(','))].join('\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='survey-results.csv';link.click();URL.revokeObjectURL(url);
}
function percent(count,total){return total?Math.round(count/total*100)+'%':'0%'}
function setText(selector,text){document.querySelector(selector).textContent=text}
function esc(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
loadResults();
</script></body></html>
